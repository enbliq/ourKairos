name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  workspace-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify repository structure
        run: |
          test -f README.md
          test -d tooling
          test -d docs

      - name: Report baseline status
        run: echo "CI baseline passed for repository scaffolding."
